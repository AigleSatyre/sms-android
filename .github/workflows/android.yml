yaml
name: Build Android APK

on:
  push:
    branches: [ "main" ] # Déclenche le build à chaque push sur la branche main
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout le code
      uses: actions/checkout@v4

    - name: Configurer le JDK (Java)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # Vous pouvez aussi utiliser 'temurin'
        java-version: '17'   # Modifiez selon la version de Java requise par votre projet

    - name: Rendre le script Gradle exécutable
      run: chmod +x ./gradlew

    - name: Compiler l'APK (Debug)
      run: ./gradlew assembleDebug

    - name: Télécharger l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
