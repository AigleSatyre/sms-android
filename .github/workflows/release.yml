name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chasem-dev/sms-android
          ref: v1.2.0
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compiler cache
        uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.18.0
      - name: Enable compiler cache
        run: |
          echo "SMS_COMPILER_CACHE=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Build and sign the APK
        env:
          SMS_ANDROID_PREVIEW: "0"
        run: |
          export SMS_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          keytool -genkey -v -keystore "$SMS_ANDROID_KEYSTORE" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          sed -i 's/git status --porcelain/false/g; /not the previews/d; /rm -f "$apk"/d' release.sh
          ./release.sh --max-workers=4
          rm -f "$SMS_ANDROID_KEYSTORE"
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mes-apk-1.2.0
          path: |
            dist/*.apk
            app/build/outputs/apk/**/*.apk
